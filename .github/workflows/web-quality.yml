name: Web quality checks

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "hooks/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "hooks/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint project
        run: npm run lint
